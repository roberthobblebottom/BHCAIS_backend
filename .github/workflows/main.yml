
name: Push to Server

on:
  push:
    branches:
      - main

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H your-server.com >> ~/.ssh/known_hosts 2>/dev/null
      
      - name: Push to Server
        run: |
          git remote add server ssh://${{secrets.USERNAME}}@${{secrets.HOST}}/root/BHCAIS_backend.git
          git push server main