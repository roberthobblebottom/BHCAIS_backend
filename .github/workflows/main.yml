name: Deploy
on:
  push:
    branches: [main]

jobs:
  # NOT WORKINGd 
  deploy:

    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_url: ${{secrets.HOST}}
          branch: ${{ github.ref }}
          ssh: true
        