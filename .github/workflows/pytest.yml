# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Pytest 

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y postgresql postgresql-contrib
        sudo systemctl start postgresql.service
        sudo -u postgres psql < ./db_scripts/reset.sql
        sudo -u postgres psql << "EOF" 
        ALTER USER postgres PASSWORD 'admin';
        EOF
        python -m pip install --upgrade pip
        pip install uv
        uv venv
        source .venv/bin/activate
        uv pip install flake8 pytest
        uv pip install -r requirements.txt

    - name: test catalogue data integration
      env:
        user: 'postgres'
        password: 'admin'
        host: '127.0.0.1'
        port: '5432'
        database: 'postgres'
        allowed_origin : 'http://localhost:5173'
        prefix : ''
        is_production : 'false' 
        JWT_SECRET_KEY: 'sdfdsfdsf'
      run: |
        uv run pytest ./src/tests/files_test.py -s
    
    - name: Test password_validation() function whether it catches validation violation
      env:
        user: 'postgres'
        password: 'admin'
        host: '127.0.0.1'
        port: '5432'
        database: 'postgres'
        allowed_origin : 'http://localhost:5173'
        prefix : ''
        is_production : 'false' 
        JWT_SECRET_KEY: 'sdfdsfdsf'
      run: |
        uv run pytest ./src/tests/password_validation_test.py -s
    
    - name: File Upload contraints violation unit testing
      env:
        user: 'postgres'
        password: 'admin'
        host: '127.0.0.1'
        port: '5432'
        database: 'postgres'
        allowed_origin : 'http://localhost:5173'
        prefix : ''
        is_production : 'false' 
        JWT_SECRET_KEY: 'sdfdsfdsf'
      run: |
        uv run pytest ./src/tests/test_upload_files_contraints_violation.py -s
